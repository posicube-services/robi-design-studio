<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Project — preview</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
      }
      .card {
        max-width: 520px;
        padding: 40px;
        text-align: center;
      }
      h1 { font-size: 24px; margin: 0 0 12px; }
      p { color: #6e6e73; line-height: 1.6; margin: 8px 0; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #fff;
        border: 1px solid #d2d2d7;
        border-radius: 6px;
        padding: 1px 6px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>React Project</h1>
      <p>
        This is a multi-file Vite + React + TypeScript project, not a single
        HTML file. The live preview appears after you build it.
      </p>
      <p>
        Run <code>Build &amp; Preview</code> in the app, or
        <code>npm install &amp;&amp; npm run build</code> locally — the built
        <code>dist/index.html</code> renders here.
      </p>
    </div>
  </body>
</html>
